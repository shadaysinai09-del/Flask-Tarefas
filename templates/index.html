<!DOCTYPE html>
<html lang="pt-BR"

<head>
    <meta charset="UTF-8">
    <title>Minhas Tarefas</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
     
  <div class="container">
     <h1>Aqui fica a lista de Tarefas</h1>

        {% if lista %}   

        <ol>
          {% for item in lista %}
              <li>{{ item }}</li>
             <a class="btn-deletar" href="/delete/{{ loop.index0 }}">🗑️</a>
          {% endfor %}
        </ol>
        {% else %}
          <p>Não há ítems! Parabéns! Você fez todas as tarefa</p>
         {% endif %}            
   


    <form action="/add" method="POST">
        <input type="text" name="tarefa">
        <button type="submit">
            Adicionar
        </button>
    </form>
   </div>
        
</body>

</html>
