<!DOCTYPE html>
<html lang="pt-BR"

<head>
    <meta charset="UTF-8">
    <title>Minhas Tarefas</title>

    <link rel=""stylesheet" href="'{{ url_for('static', filename='style.css') }}">
</head>

<body>
     
    <div class="container">
     Aqui fica a lista de Tarefas-

     {%  if lista %}
        <ol>
          {% for item in lista %}
              <li>{{ item }}</li>
             <a href="/delete/{{loop.index0}}"><button>🗑️</button></a>
          {% endfor %}
        </ol>
     {% else %}
          <p>Não há ítems! Parábens! Você fez tudo das tarefa</p>
     {% endif %}            
   


    <form action="/add" method="POST">
        <input type="text" name="tarefa">
        <button type="submit">
            Adicionar
        </button>
        
</body>
